<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TXT撿票助手">
<meta name="theme-color" content="#111827">
<title>TXT NOL 撿票助手</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#111827}
.wrap{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{font-size:24px;margin:0 0 6px}.sub{color:#6b7280;font-size:13px}.clock{font-size:30px;font-weight:700;margin-top:8px}
label{display:block;font-weight:700;margin:12px 0 7px}select,button{width:100%;min-height:48px;border-radius:13px;border:1px solid #d1d5db;background:#fff;padding:0 13px;font-size:16px}
button{border:0;background:#111827;color:white;font-weight:700;margin-top:9px}button.secondary{background:#e5e7eb;color:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.day{padding:12px 4px;border:1px solid #d1d5db;border-radius:13px;text-align:center;font-weight:700;background:#fff}.day.active{background:#111827;color:#fff;border-color:#111827}
.count{font-size:22px;font-weight:800;margin-top:7px}.status{padding:12px;border-radius:12px;background:#f9fafb;margin-top:10px;font-size:14px}.warn{color:#92400e;background:#fffbeb}
a.btn{display:block;text-align:center;text-decoration:none;background:#111827;color:#fff;border-radius:13px;padding:14px;font-weight:700;margin-top:9px}
.small{font-size:12px;color:#6b7280;line-height:1.55}.log{font-size:13px;line-height:1.6;max-height:130px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🎫 TXT NOL 撿票助手</h1>
<div class="sub">WORLD TOUR 〈STEAL THE WIND〉 IN SEOUL</div>
<div class="clock" id="clock">--:--:--</div>
<div class="sub">韓國標準時間 KST（UTC+9）</div>
</div>

<div class="card">
<label>選擇場次</label>
<div class="days">
<div class="day active" data-date="2026-11-13">11/13<br><span class="small">19:00</span></div>
<div class="day" data-date="2026-11-14">11/14<br><span class="small">18:00</span></div>
<div class="day" data-date="2026-11-15">11/15<br><span class="small">17:00</span></div>
</div>
<div class="count" id="countdown">計算中…</div>
</div>

<div class="card">
<label for="type">票種</label>
<select id="type">
<option>M&G</option><option>SOUND CHECK</option><option>GENERAL</option>
</select>
<label for="qty">數量</label>
<select id="qty"><option>1</option><option>2</option></select>
<a class="btn" href="https://nol.yanolja.com/" target="_blank" rel="noopener">🌐 開啟 NOL Ticket</a>
<button id="remind">🔔 開始撿票提醒</button>
<button id="stop" class="secondary">停止提醒</button>
</div>

<div class="card">
<div class="status warn">⚠️ 本工具只做低頻提醒與手動輔助，不會自動刷票、繞過 CAPTCHA／排隊、選位或付款。</div>
<div class="status" id="status">目前狀態：尚未啟動提醒</div>
</div>

<div class="card">
<b>📋 操作紀錄</b>
<div class="log" id="log">尚無紀錄</div>
</div>

<div class="card small">
<strong>加入 iPhone 主畫面：</strong><br>
Safari 開啟這個網頁後，按「分享」→「加入主畫面」→「加入」。<br>
之後直接從桌面點「TXT撿票助手」即可使用。
</div>
</div>

<script>
const shows={
"2026-11-13":"2026-11-13T19:00:00+09:00",
"2026-11-14":"2026-11-14T18:00:00+09:00",
"2026-11-15":"2026-11-15T17:00:00+09:00"
};
let selected="2026-11-13", timer=null, remindTimer=null;
const $=id=>document.getElementById(id);
function kstNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}))}
function fmt(n){return String(n).padStart(2,"0")}
function update(){
 const now=kstNow();
 $("clock").textContent=`${fmt(now.getHours())}:${fmt(now.getMinutes())}:${fmt(now.getSeconds())}`;
 const target=new Date(shows[selected]);
 const diff=target-new Date();
 if(diff<=0){$("countdown").textContent="場次已開始／請到 NOL 查看";return}
 let s=Math.floor(diff/1000),d=Math.floor(s/86400);s%=86400;
 let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;
 $("countdown").textContent=`倒數 ${d}天 ${fmt(h)}:${fmt(m)}:${fmt(s)}`;
}
function log(msg){const t=new Date().toLocaleTimeString();$("log").innerHTML=`${t}　${msg}<br>`+$("log").innerHTML}
document.querySelectorAll(".day").forEach(x=>x.onclick=()=>{
 document.querySelectorAll(".day").forEach(y=>y.classList.remove("active"));x.classList.add("active");
 selected=x.dataset.date; update(); log(`切換至 ${selected}`);
});
$("remind").onclick=()=>{
 if(remindTimer) return;
 $("status").textContent=`目前狀態：提醒中｜${selected}｜${$("type").value}｜${$("qty").value} 張`;
 log("已開始低頻提醒。請保持 NOL 頁面開啟並手動確認票況。");
 remindTimer=setInterval(()=>{
   if(navigator.vibrate) navigator.vibrate(120);
   log("提醒：請手動回 NOL 查看是否有可購票位。");
 },60000);
};
$("stop").onclick=()=>{
 if(remindTimer){clearInterval(remindTimer);remindTimer=null;}
 $("status").textContent="目前狀態：尚未啟動提醒"; log("已停止提醒。");
};
update(); setInterval(update,1000);
</script>
</body>
</html>
